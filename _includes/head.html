<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="preload" href="{{ '/assets/fonts/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/13.0.1/twemoji.min.js"></script>
  <title>{{ page.tab_title | default: page.title | default: site.title | escape }}</title>
  <!-- 기본 스타일 -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.css_file %}
  <link rel="stylesheet" href="{{ page.css_file | relative_url }}">
  {% endif %}
  {% if page.lab_css %}
  <link rel="stylesheet" href="{{ page.lab_css | relative_url }}">
  {% endif %}

  <!-- ✅ Font Awesome 추가 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 페이지 전용 JS -->
  {% if page.js_file %}
  <script defer src="{{ page.js_file | relative_url }}"></script>
  {% endif %}

  {% for script in page.js_files %}
  <script defer src="{{ script | relative_url }}"></script>
  {% endfor %}

  {% seo title=false %}

</head>
