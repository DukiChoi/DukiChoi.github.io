{% if include.articles.size > 0 %}
<ol class="theory-index">
  {% for entry in include.articles %}
  <li>
    <a class="theory-index__link" href="{{ entry.url | relative_url }}">
      <{{ include.heading }}>{{ entry.title | escape }}</{{ include.heading }}>
      {% if entry.description %}<p>{{ entry.description | escape }}</p>{% endif %}
    </a>
  </li>
  {% endfor %}
</ol>
{% else %}
<p class="theory-subject__empty">{{ ui.empty }}</p>
{% endif %}
