# Pages CMS uses GitHub authentication; no credentials belong in this file.
media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, gif, avif]
  rename: safe

content:
  - name: theory
    label: 이론 자료 글
    type: collection
    path: assets/theories
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    subfolders: true
    exclude: [.gitkeep]
    view:
      primary: title
      fields: [title, published, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 짧은 소개
        type: text
      - name: order
        label: 목록 순서
        type: number
        required: true
        default: 1000
        options:
          min: 0
      - name: published
        label: 사이트에 게시
        type: boolean
        default: true
        description: 끄면 사이트에서 숨깁니다. 공개 GitHub 저장소의 파일까지 비공개로 바뀌지는 않습니다.
      - name: body
        label: 본문
        type: rich-text
        required: true
        options:
          format: markdown

  - name: programs
    label: 프로그램 소개
    type: collection
    path: _programs
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    subfolders: false
    exclude: [.gitkeep, market-peek.html]
    view:
      primary: title
      fields: [title, platform, published, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 프로그램 이름
        type: string
        required: true
      - name: description
        label: 짧은 소개
        type: text
        required: true
      - name: platform
        label: 실행 환경
        type: string
        description: 예) Windows, macOS, 웹
      - name: external_url
        label: 바로 연결할 주소
        type: string
        description: 배너를 누르면 이동할 기존 소개 페이지 주소입니다. 비워두면 이 사이트의 프로그램 소개를 엽니다.
        pattern:
          regex: '^(https://[^\s]+)?$'
          message: https://로 시작하는 주소를 입력하세요.
      - name: order
        label: 목록 순서
        type: number
        required: true
        default: 1000
        options:
          min: 0
      - name: published
        label: 사이트에 게시
        type: boolean
        default: true
        description: 끄면 사이트에서 숨깁니다. 공개 GitHub 저장소의 파일까지 비공개로 바뀌지는 않습니다.
      - name: featured
        label: 목록에서 강조
        type: boolean
        default: false
      - name: banner_style
        label: 배너 스타일
        type: select
        default: auto
        description: /admin/program-styles/에서 색과 반사 효과를 미리 볼 수 있습니다.
        options:
          values:
            - name: auto
              label: 자동 — 방문할 때마다 무작위
            - name: emerald-cosmos
              label: Emerald Cosmos — 에메랄드 · 원형 은박
            - name: sapphire-holo
              label: Sapphire Holo — 사파이어 · 세로 반사광
            - name: amethyst-amazing
              label: Amethyst Amazing — 보라 · 미세 입자
            - name: ruby-radiant
              label: Ruby Radiant — 루비 · 다이아몬드
            - name: bronze-reverse
              label: Bronze Reverse — 구리 · 반복 무늬
            - name: arctic-vstar
              label: Arctic VStar — 청록 · 얼음 결정
            - name: rose-full-art
              label: Rose Full Art — 로즈 · 물결 음각
            - name: aurora-rainbow
              label: Aurora Rainbow — 오로라 · 무지갯빛 펄
            - name: gold-secret
              label: Gold Secret — 골드 · 금박 입자
            - name: graphite-shiny
              label: Graphite Shiny — 흑연 · 은색 별
      - name: icon
        label: 아이콘
        type: image
      - name: cover
        label: 대표 이미지
        type: image
      - name: cover_alt
        label: 대표 이미지 설명
        type: string
      - name: links
        label: 사용 링크
        type: object
        list: true
        fields:
          - name: label
            label: 버튼 이름
            type: string
            required: true
          - name: url
            label: 주소
            type: string
            required: true
            pattern:
              regex: '^(https://[^\s]+|/(?!/)[^\s]*)$'
              message: https://로 시작하는 주소나 /assets/ 같은 사이트 내부 경로를 입력하세요.
      - name: body
        label: 본문
        type: rich-text
        required: true
        options:
          format: markdown

settings:
  content:
    merge: true
