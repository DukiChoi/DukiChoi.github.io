- id: basic
  title:
    ko: 기본
    en: Fundamentals
    ja: 基礎
  description:
    ko: 정렬과 탐색의 동작부터 한 단계씩 익힙니다.
    en: Start with the mechanics of sorting and traversal.
    ja: 整列と探索の動きを1ステップずつ学びます。
- id: applied
  title:
    ko: 응용
    en: Applications
    ja: 応用
  description:
    ko: 자료를 저장하고 탐색 범위를 줄이는 기법을 문제에 연결합니다.
    en: Apply data organization and search techniques to concrete problems.
    ja: データの管理や探索範囲を絞る技法を問題に応用します。
- id: advanced
  title:
    ko: 고급 개념
    en: Advanced concepts
    ja: 発展
  description:
    ko: 분할 정복, 힙, 최단 경로와 여러 알고리즘의 결합을 다룹니다.
    en: Explore divide and conquer, heaps, shortest paths, and combined algorithms.
    ja: 分割統治、ヒープ、最短経路、複数のアルゴリズムの組み合わせを学びます。
